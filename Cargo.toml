[package]
name = "shm-mpsc-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
apache-avro = "0.17"
async-trait = "0.1"
capnp = "0.20"
capnp-rpc = "0.20"
capnp-futures = "0.20"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
flatbuffers = "24"
futures = "0.3"
nix = { version = "0.29", features = ["socket", "uio", "mman", "fs"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
capnpc = "0.20"
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "producer"
path = "src/bin/producer.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
